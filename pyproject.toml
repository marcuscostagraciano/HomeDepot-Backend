[project]
name = "homedepot"
version = "0.1.0"
description = "Backend for Home Depot's"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "pwdlib[argon2]",
    "pydantic[email]>=2.12.5",
    "pyjwt",
    "tzdata>=2026.2",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pylance>=7.0.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]


[tool.uv]
package = true

[project.scripts]
serve = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
data_file = "coverage/.coverage"
omit = ["*/__init__.py"]
