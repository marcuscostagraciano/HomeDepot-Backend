[project]
name = "homedepot"
version = "0.1.0"
description = "Backend for Home Depot's"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "pydantic>=2.12.5",
    "pylance>=2.0.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
]

[tool.uv]
package = true

[project.scripts]
serve = "main:main"
